name: Analyze Fund

on:
  workflow_dispatch:
    inputs:
      fund_code:
        description: "基金代码，例如 163417"
        required: true
        default: "163417"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fund analysis
        run: |
          python run.py "${{ github.event.inputs.fund_code }}" --no-browser

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: fund-report-${{ github.event.inputs.fund_code }}
          path: assets/fund-${{ github.event.inputs.fund_code }}.html
